# @package dataset_config
_target_: dna2vec.config_schema.DatasetConfigSchemaUniformSampling

# FASTA files for training
fasta_file: "/mnt/SSD7/yigit/dnarde/ch2/NC-000002.fasta"

# Fragment sampling parameters
range_min: 1500
range_max: 2000

# Read sampling parameters  
subsequence_range_min: 150
subsequence_range_max: 500

# Dataset class and sampling strategy
dataset: dna2vec_sft.dataset.FastaUniformSampler
sampling_strategy: "three_nonoverlapping_subsequence_uppercase"

# Enable read regularizer (adds noise for robustness)
read_regularizer: true 